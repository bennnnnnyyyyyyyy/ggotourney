
<!DOCTYPE html>
<html lang="en">
<head><script type="text/javascript" src="/___vscode_livepreview_injected_script"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GGO FC 26 Tournament</title>
<link rel="icon" type="image/png" sizes="32x32" href="./GGO-White-Var3-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./GGO-White-Var3-16x16.png">
<link rel="apple-touch-icon" href="./GGO-White-Var3.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'TTFirsNeue';
    src: url('./TTFirsNeue-DemiBold.ttf') format('truetype');
    font-weight: 600;
    font-style: normal;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #00D15E;
    --green-dim: #00b359;
    --dark: #010101;
    --card: #111111;
    --card2: #161e16;
    --border: #1e2e1e;
    --text: #e8f5e8;
    --muted: #6b8f6b;
    --gold: #ffd600;
    --silver: #b0bec5;
    --bronze: #ff8a65;
    --red: #ff4444;
    --draw: #66b3ff;
    --accent-blue: #004BC8;
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'TTFirsNeue', 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #010101 0%, #0a1a0a 50%, #010101 100%);
    border-bottom: 2px solid var(--green);
    padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(10px);
  }
  .logo {
    display: flex; align-items: center; gap: 20px;
  }
  .logo img {
    max-height: 50px;
    width: auto;
    filter: drop-shadow(0 0 10px rgba(0, 209, 94, 0.3));
  }
  .logo-text { line-height: 1.1; }
  .logo-text h1 { font-family: 'TTFirsNeue', sans-serif; font-size: 2.2rem; color: var(--green); letter-spacing: 1px; font-weight: 600; }
  .logo-text p { font-size: 0.75rem; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; font-family: 'DM Sans', sans-serif; }

  /* ── NAV ── */
  nav { display: flex; gap: 8px; }
  .nav-btn {
    padding: 10px 24px; border-radius: 8px;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-family: 'TTFirsNeue', sans-serif;
    font-size: 0.85rem; font-weight: 600; letter-spacing: 1px;
    cursor: pointer; transition: all 0.2s; text-transform: uppercase;
  }
  .nav-btn:hover { border-color: var(--green); color: var(--green); background: rgba(0, 209, 94, 0.05); }
  .nav-btn.active { background: var(--green); color: #000; border-color: var(--green); box-shadow: 0 0 15px rgba(0, 209, 94, 0.4); font-weight: 700; }

  /* ── MAIN ── */
  main { padding: 32px; max-width: 1400px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }

  /* ── SECTION TITLE ── */
  .section-title {
    font-family: 'TTFirsNeue', sans-serif;
    font-size: 1.8rem; letter-spacing: 2px;
    color: var(--green); margin-bottom: 24px;
    display: flex; align-items: center; gap: 12px;
    font-weight: 600;
  }
  .section-title::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--green), transparent);
  }

  /* ── GROUPS GRID ── */
  /* ── STANDINGS GRID — fluid, never clips ── */
  .groups-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: clamp(10px, 2vw, 20px);
  }

  .group-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    container-type: inline-size;
    container-name: groupcard;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .group-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,230,118,0.12);
  }

  .group-header {
    background: linear-gradient(105deg, var(--green-dim) 0%, #004d22 60%, #002a10 100%);
    padding: clamp(8px,1.5cqi,14px) clamp(10px,2cqi,18px);
    display: flex; align-items: center; justify-content: space-between;
    gap: 6px;
  }
  .group-label {
    font-family: 'TTFirsNeue', sans-serif;
    font-size: clamp(1rem, 4cqi, 1.5rem);
    color: #000; letter-spacing: 1px; font-weight: 600;
    white-space: nowrap;
  }
  .group-badge {
    font-size: clamp(0.45rem, 1.8cqi, 0.65rem);
    color: rgba(0,0,0,0.65); letter-spacing: 1.5px;
    text-transform: uppercase; white-space: nowrap;
  }

  /* Table uses fixed layout so columns never blow out */
  .group-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  /* Column widths: player name gets leftover space, stat cols are equal & fluid */
  .group-table col.col-player { width: auto; }
  .group-table col.col-stat   { width: clamp(18px, 7cqi, 34px); }
  .group-table col.col-pts    { width: clamp(22px, 8cqi, 38px); }

  .group-table thead th {
    padding: clamp(4px,1.2cqi,7px) clamp(2px,1cqi,5px);
    font-size: clamp(0.45rem, 1.8cqi, 0.62rem);
    color: var(--muted);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  .group-table thead th.th-player { text-align: left; padding-left: clamp(6px,1.5cqi,12px); }

  .group-table tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.03);
    transition: background 0.15s;
  }
  .group-table tbody tr:hover { background: rgba(0,230,118,0.05); }
  .group-table tbody tr:last-child { border-bottom: none; }

  .group-table td {
    padding: clamp(5px,1.5cqi,9px) clamp(2px,1cqi,5px);
    font-size: clamp(0.6rem, 2.2cqi, 0.82rem);
    text-align: center;
    overflow: hidden;
    white-space: nowrap;
  }
  .group-table td.td-player {
    text-align: left;
    font-weight: 500;
    padding-left: clamp(6px,1.5cqi,12px);
    overflow: hidden;
  }
  .player-name-cell {
    display: flex;
    align-items: center;
    gap: clamp(3px,1cqi,6px);
    overflow: hidden;
    min-width: 0;
  }
  .player-name-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    flex: 1;
  }

  .rank {
    width: clamp(16px, 5cqi, 24px);
    height: clamp(16px, 5cqi, 24px);
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: clamp(0.5rem, 1.8cqi, 0.7rem);
    font-weight: 700;
    flex-shrink: 0;
  }
  .rank-1 { background: var(--gold); color: #000; }
  .rank-2 { background: var(--silver); color: #000; }
  .rank-3 { background: var(--bronze); color: #000; }
  .rank-4 { background: var(--border); color: var(--muted); }

  .qualified { border-left: 3px solid var(--green); }
  @keyframes glowPulse {
    0%,100% { box-shadow: none; }
    50%      { box-shadow: inset 0 0 8px rgba(0,230,118,0.15); }
  }
  .qualified { animation: glowPulse 3s ease-in-out infinite; }

  .pts-cell {
    color: var(--green); font-weight: 700;
    font-size: clamp(0.65rem, 2.5cqi, 0.92rem);
  }
  .gd-pos { color: var(--green); }
  .gd-neg { color: var(--red); }

  /* ── MATCHES ── */
  .matches-filter {
    display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 16px; border-radius: 20px;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .filter-btn:hover { border-color: var(--green); color: var(--green); }
  .filter-btn.active { background: rgba(0,230,118,0.15); border-color: var(--green); color: var(--green); }

  .matches-list { display: flex; flex-direction: column; gap: 10px; }
  .match-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 20px;
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 16px;
    transition: all 0.2s;
  }
  .match-card:hover { border-color: var(--green); background: var(--card2); }
  .match-card.played { border-left: 3px solid var(--green); }
  .match-card.pending { border-left: 3px solid var(--border); opacity: 0.75; }
  .player-side { display: flex; align-items: center; gap: 10px; }
  .player-side.right { flex-direction: row-reverse; }
  .player-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
  }
  .player-name { font-weight: 500; font-size: 0.9rem; }
  .player-side.right .player-name { text-align: right; }
  .match-score {
    text-align: center; min-width: 80px;
  }
  .score-display {
    font-family: 'TTFirsNeue', sans-serif; font-size: 2rem;
    color: var(--green); letter-spacing: 2px; line-height: 1;
    font-weight: 600;
  }
  .score-pending {
    font-family: 'TTFirsNeue', sans-serif; font-size: 1.4rem;
    color: var(--muted); letter-spacing: 1px;
    font-weight: 600;
  }
  .match-time { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .match-day-header {
    font-family: 'TTFirsNeue', sans-serif;
    font-size: 1.1rem; letter-spacing: 2px; color: var(--muted);
    padding: 16px 0 8px; text-transform: uppercase;
    font-weight: 600;
  }
  .winner-badge { font-size: 0.65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
  .draw-badge { font-size: 0.65rem; color: #40c4ff; text-transform: uppercase; letter-spacing: 1px; }
  .match-card.draw { border-left: 3px solid #40c4ff; opacity: 1; }

  /* ── KNOCKOUT BRACKET (VERTICAL) ── */
  .bracket-container { padding: 20px 0; max-width: 600px; margin: 0 auto; }
  
  .vertical-bracket {
    display: flex; flex-direction: column; gap: 40px;
  }
  
  .vertical-round {
    display: flex; flex-direction: column; gap: 16px;
  }
  
  .vertical-round-title {
    font-family: 'TTFirsNeue', sans-serif; font-size: 1.2rem; color: var(--green);
    text-align: center; margin-bottom: 8px; letter-spacing: 2px;
    text-transform: uppercase; border-bottom: 1px solid var(--border);
    padding-bottom: 8px; position: relative; font-weight: 600;
  }
  
  .vertical-matches {
    display: flex; flex-direction: column; gap: 12px;
  }
  
  /* Pairing up matches to show bracket relationship */
  .match-pair {
    display: flex; flex-direction: column; gap: 12px;
    position: relative; padding: 12px;
    background: rgba(0,209,94,0.02);
    border: 1px solid rgba(0,209,94,0.1);
    border-radius: 12px;
  }
  .match-pair-label {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    background: var(--dark); padding: 0 10px; font-size: 0.7rem; color: var(--muted);
    letter-spacing: 1px; text-transform: uppercase; font-weight: 600;
    border: 1px solid rgba(0,209,94,0.1); border-radius: 20px;
  }

  /* Match Cards (Compact Style) */
  .bracket-match {
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; width: 100%;
    transition: all 0.2s; display: flex; flex-direction: column;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  .bracket-match:hover { border-color: var(--green-dim); transform: scale(1.02); }
  
  .bracket-match-label { 
    font-size: 0.6rem; color: var(--muted); letter-spacing: 2px; 
    text-align: center; padding: 4px; background: rgba(0,0,0,0.4); 
    text-transform: uppercase; font-weight: 600;
  }
  
  .bracket-player {
    padding: 8px 12px; display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 500;
  }
  .bracket-player:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.05); }
  
  /* Placeholder crested badge */
  .bracket-crest {
    width: 22px; height: 22px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font-size: 0.55rem; font-weight: 700; color: #000; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
  }
  
  .bracket-player-name {
    text-overflow: ellipsis; overflow: hidden; white-space: nowrap; font-family: 'DM Sans', sans-serif;
  }
  
  .bracket-player-score { 
    font-family: 'TTFirsNeue', sans-serif; font-size: 1rem; color: var(--text); font-weight: 600; text-align: right; width: 24px;
  }
  
  .bracket-player.winner .bracket-player-score { color: var(--green); }
  .bracket-player.loser { opacity: 0.5; }
  .bracket-player.loser .bracket-player-score { color: var(--muted); }

  /* ── STATS ── */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .stat-card-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    font-family: 'TTFirsNeue', sans-serif; font-size: 1.1rem;
    letter-spacing: 1px; color: var(--green);
    font-weight: 600;
  }
  .stat-row {
    display: flex; align-items: center; padding: 12px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.03); gap: 14px;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-rank { font-family: 'TTFirsNeue', sans-serif; font-size: 1.3rem; color: var(--muted); width: 28px; font-weight: 600; }
  .stat-name { flex: 1; font-weight: 500; font-size: 0.9rem; }
  .stat-group { font-size: 0.65rem; color: var(--muted); background: var(--border); border-radius: 4px; padding: 2px 6px; }
  .stat-bar-wrap { flex: 2; }
  .stat-bar {
    height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, var(--green), var(--green-dim));
    transition: width 1s ease;
  }
  .stat-value { font-family: 'TTFirsNeue', sans-serif; font-size: 1.4rem; color: var(--green); min-width: 36px; text-align: right; font-weight: 600; }

  /* ── CHAMPION BANNER ── */
  .champion-section {
    text-align: center; padding: 60px 20px;
    background: radial-gradient(ellipse at center, rgba(255,214,0,0.08) 0%, transparent 70%);
    border: 1px solid rgba(255,214,0,0.15); border-radius: 16px;
    margin-bottom: 32px;
  }
  .champion-trophy { font-size: 5rem; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .champion-title { font-family:'TTFirsNeue',sans-serif; font-size:1rem; letter-spacing:5px; color:var(--muted); margin:12px 0 6px; font-weight: 600; }
  .champion-name { font-family:'TTFirsNeue',sans-serif; font-size:3.5rem; color:var(--gold); letter-spacing:2px; font-weight: 600; }
  .champion-subtitle { font-size:0.75rem; color:var(--muted); letter-spacing:2px; text-transform:uppercase; font-family: 'DM Sans', sans-serif; }

  /* Schedule */
  .schedule-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .sched-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  .sched-day {
    background: linear-gradient(90deg, #1a2a1a, #0f1f0f);
    padding: 10px 16px; font-family: 'TTFirsNeue', sans-serif;
    font-size: 1rem; letter-spacing: 1px; color: var(--green);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  .sched-match { padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.03); display: flex; justify-content: space-between; }
  .sched-match:last-child { border-bottom: none; }
  .sched-time { font-size: 0.75rem; color: var(--muted); }
  .sched-label { font-size: 0.85rem; font-weight: 600; color: var(--text); }

  /* ── SYNC UI ── */
  .sync-container { display: flex; align-items: center; gap: 16px; }
  .sync-status { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); position: relative; }
  .status-dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-dot.loading { background: var(--gold); animation: pulse 1s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  .sync-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 0.75rem; border-color: var(--border); }
  .sync-btn svg { transition: transform 0.5s; }
  .sync-btn.loading svg { animation: rotate 1s linear infinite; }
  @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .settings-btn { padding: 6px; border-color: var(--border); display: flex; align-items: center; justify-content: center; }
  .settings-btn svg { width: 16px; height: 16px; color: var(--muted); }
  .settings-btn:hover svg { color: var(--green); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center; z-index: 200;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card); border: 2px solid var(--green); border-radius: 12px;
    width: 90%; max-width: 500px; padding: 32px; box-shadow: 0 0 30px rgba(0,209,94,0.2);
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .modal-header h2 { font-family: 'TTFirsNeue', sans-serif; color: var(--green); font-size: 1.5rem; }
  .close-modal { cursor: pointer; color: var(--muted); }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .form-group input {
    width: 100%; background: var(--dark); border: 1px solid var(--border);
    padding: 12px; border-radius: 6px; color: var(--text); font-family: 'DM Sans', sans-serif;
  }
  .form-group input:focus { border-color: var(--green); outline: none; }
  .save-settings { width: 100%; padding: 12px; background: var(--green); color: #000; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
  .save-settings:hover { box-shadow: 0 0 15px rgba(0,209,94,0.4); }

  /* Responsive — Tablet */
  @media (max-width: 768px) {
    header { flex-direction: column; gap: 12px; padding: 12px 16px; }
    .logo img { max-height: 36px; }
    .logo-text h1 { font-size: 1.6rem; }
    .logo-text p { font-size: 0.65rem; letter-spacing: 2px; }
    main { padding: 12px; }
    .stats-grid { grid-template-columns: 1fr; }
    nav { flex-wrap: wrap; justify-content: center; gap: 6px; }
    .nav-btn { padding: 8px 14px; font-size: 0.75rem; }
    .sync-container { flex-wrap: wrap; justify-content: center; gap: 8px; }
    .groups-grid { grid-template-columns: 1fr; }
    .section-title { font-size: 1.4rem; }
    .match-card { grid-template-columns: 1fr auto 1fr; gap: 8px; padding: 10px 12px; }
    .score-display { font-size: 1.5rem; }
    .player-name { font-size: 0.8rem; }
    .player-avatar { width: 30px; height: 30px; font-size: 0.75rem; }
    .schedule-grid { grid-template-columns: 1fr; }
  }

  /* Responsive — Phone */
  @media (max-width: 480px) {
    header { padding: 10px 12px; gap: 10px; }
    .logo img { max-height: 30px; }
    .logo-text h1 { font-size: 1.3rem; }
    main { padding: 8px; }
    .nav-btn { padding: 6px 10px; font-size: 0.7rem; letter-spacing: 0.5px; }
    .section-title { font-size: 1.1rem; letter-spacing: 1px; }
    .group-card { border-radius: 8px; }
    .match-card { padding: 8px 10px; gap: 4px; }
    .player-avatar { width: 26px; height: 26px; font-size: 0.65rem; }
    .player-name { font-size: 0.72rem; }
    .score-display { font-size: 1.3rem; }
    .score-pending { font-size: 1rem; }
        .match-score { min-width: 50px; }
    .match-time { font-size: 0.6rem; }
    .match-day-header { font-size: 0.9rem; }
    .stat-row { padding: 8px 12px; gap: 8px; }
    .stat-rank { font-size: 1rem; width: 22px; }
    .stat-name { font-size: 0.78rem; }
    .stat-value { font-size: 1.1rem; }
    .stat-bar-wrap { flex: 1; }
    .sched-day { font-size: 0.85rem; padding: 8px 12px; }
    .sched-match { padding: 8px 12px; }
    .sched-label { font-size: 0.78rem; }
    .champion-name { font-size: 2.2rem; }
    .champion-trophy { font-size: 3.5rem; }
    .champion-section { padding: 30px 12px; }
    .modal { padding: 20px; width: 95%; }
  }

async function fetchSheetData(sheetName) {
  if (!CONFIG.spreadsheetId) return null;
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.spreadsheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}`;
  try {
    const response = await fetch(url);
    const text = await response.text();
    const json = JSON.parse(text.substr(47).slice(0, -2));
    const columns = json.table.cols.map(c => c.label);
    return json.table.rows.map(row => {
      const obj = {};
      row.c.forEach((cell, i) => {
        if (columns[i]) obj[columns[i]] = cell ? (cell.f || cell.v) : null;
      });
      return obj;
    });
  } catch (e) {
    console.error(`Error fetching sheet ${sheetName}:`, e);
    return null;
  }
}

function processData() {
  let { players, matches } = STATE;

  // Fallback: If 'Players' tab is empty, extract players from the bridge leaderboard
  if ((!players || players.length === 0) && STATE._bridgeLeaderboard && STATE._bridgeLeaderboard.length > 0) {
    players = STATE._bridgeLeaderboard.map(p => ({
      name: p.name,
      group: p.group || '?'
    }));
  }

  if (players && players.length > 0) {
    // Always calculate from matches (the source of truth for played/draws now)
    const lb = players.map(p => ({
      name: p.name, group: p.group,
      played: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0
    }));

    matches.forEach(m => {
      // Use the 'played' field as the filter
      if (!m.played) return;
      
      const p1 = lb.find(p => p.name === m.p1);
      const p2 = lb.find(p => p.name === m.p2);
      if (!p1 || !p2) return;

      const s1 = parseInt(m.s1 || 0), s2 = parseInt(m.s2 || 0);
      p1.played++; p2.played++;
      p1.gf += s1; p1.ga += s2; p2.gf += s2; p2.ga += s1;
      
      if (s1 > s2) { p1.w++; p2.l++; p1.pts += 3; }
      else if (s1 < s2) { p2.w++; p1.l++; p2.pts += 3; }
      else { p1.d++; p2.d++; p1.pts++; p2.pts++; }
    });

    lb.forEach(p => { p.gd = p.gf - p.ga; });

    // ── FIX 1: Robust Standings override with case-insensitive matching ──────
    // STATE.standings is now guaranteed to be set BEFORE processData() is called.
    if (STATE.standings && STATE.standings.length > 0) {
      const parseSafe = (val, fallback) => {
        if (val === undefined || val === null || val === '') return fallback;
        const n = parseInt(val);
        return isNaN(n) ? fallback : n;
      };

      // Case-insensitive, multi-alias field lookup helper
      const getField = (row, ...keys) => {
        for (const k of keys) {
          // Exact match first
          if (row[k] !== undefined && row[k] !== null && row[k] !== '') return row[k];
          // Case-insensitive fallback
          const lk = k.toLowerCase();
          for (const rk of Object.keys(row)) {
            if (rk.toLowerCase() === lk && row[rk] !== undefined && row[rk] !== null && row[rk] !== '') return row[rk];
          }
        }
        return undefined;
      };

      STATE.standings.forEach(apiRow => {
        // FIX: trim + case-insensitive player name match
        const playerName = (getField(apiRow, 'Player', 'name', 'Name', 'PLAYER') || '').toString().trim();
        if (!playerName) return;

        const target = lb.find(p => (p.name || '').trim().toLowerCase() === playerName.toLowerCase());
        if (!target) {
          console.warn('processData: No leaderboard match for standings row player "' + playerName + '"');
          return;
        }

        const before = { played: target.played, w: target.w, d: target.d, l: target.l, pts: target.pts };

        // FIX: handle "Draw" vs "Draws" and other header variations via getField aliases
        target.played = parseSafe(getField(apiRow, 'Played', 'played', 'GP', 'P'),         target.played);
        target.w      = parseSafe(getField(apiRow, 'Wins',   'W', 'wins', 'Won'),           target.w);
        target.d      = parseSafe(getField(apiRow, 'Draw',   'Draws', 'D', 'draw', 'draws'),target.d);
        target.l      = parseSafe(getField(apiRow, 'Loss',   'Losses', 'L', 'loss', 'Lost'),target.l);
        target.gf     = parseSafe(getField(apiRow, 'Goals For',   'GF', 'gf', 'goals_for'), target.gf);
        target.ga     = parseSafe(getField(apiRow, 'Goals Against','GA', 'ga', 'goals_against'), target.ga);
        target.gd     = parseSafe(getField(apiRow, 'Goal Diff',   'GD', 'gd', 'goal_diff', 'GoalDiff'), target.gd);
        target.pts    = parseSafe(getField(apiRow, 'Points', 'Pts', 'pts', 'PTS'),          target.pts);
        target.group  = (getField(apiRow, 'Group', 'group') || target.group);

        console.log(
          'processData: Overrode "' + playerName + '" — ' +
          'calculated: P' + before.played + ' W' + before.w + ' D' + before.d + ' Pts' + before.pts +
          ' → sheet: P' + target.played + ' W' + target.w + ' D' + target.d + ' Pts' + target.pts
        );
      });
      console.log('processData: Standings override complete (' + STATE.standings.length + ' rows processed).');
    } else {
      console.log('processData: No standings data from bridge — using match-calculated values.');
    }

    // ── ALWAYS recalculate pts and gd from W/D/L and GF/GA ──────────────────
    // The sheet's Points and Goal Diff columns are computed formulas that include
    // phantom points/goals from unplayed matches (e.g. Ben Camel P0 shows Pts=3).
    // We never trust those columns — we derive them ourselves from the clean stats.
    lb.forEach(p => {
      p.pts = (p.w * 3) + p.d;
      p.gd  = p.gf - p.ga;
    });
    console.log('processData: Recalculated pts and gd from W/D/L and GF/GA (sheet computed columns ignored).');

    STATE.leaderboard = lb;
    console.log('processData: Generated leaderboard (' + lb.length + ' entries)');
  } else {
    STATE.leaderboard = [];
    STATE.goals = [];
    console.warn('processData: No players available.');
    return;
  }

  // Determine Qualified (Top 2 per group) — only if bridge didn't provide it
  if (!STATE._bridgeQualified || Object.keys(STATE._bridgeQualified).length === 0) {
    const groups = ['A','B','C','D','E','F','G','H'];
    const q16 = {};
    groups.forEach(g => {
      const sorted = STATE.leaderboard.filter(p => p.group === g)
        .sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
      if (sorted[0]) q16[g + '1'] = sorted[0].name;
      if (sorted[1]) q16[g + '2'] = sorted[1].name;
    });
    STATE.qualified16 = q16;
  }

  // Calculate Top Scorers from leaderboard GF (more accurate than match scores for 0-0 bug)
  STATE.goals = STATE.leaderboard
    .filter(p => p.gf > 0)
    .map(p => ({ name: p.name, goals: p.gf, group: p.group }))
    .sort((a,b) => b.goals - a.goals);

  console.log('processData: Done. ' + STATE.leaderboard.length + ' players, ' + STATE.goals.length + ' scorers.');
}

async function fetchRelayData() {
  let scriptUrl = CONFIG.appsScriptUrl;
  if (!scriptUrl || !CONFIG.spreadsheetId) return null;

  if (!scriptUrl.startsWith('http')) {
    if (scriptUrl.length > 30) {
      scriptUrl = 'https://script.google.com/macros/s/' + scriptUrl + '/exec';
    } else {
      console.error('Invalid Apps Script URL'); return null;
    }
  }

  const url = scriptUrl + '?id=' + CONFIG.spreadsheetId;
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('Network error (' + response.status + ')');
    const data = await response.json();

    if (data.debug_logs && data.debug_logs.length > 0) {
      console.log('--- BRIDGE APPS SCRIPT LOGS ---');
      data.debug_logs.forEach(msg => console.log('  ' + msg));
      console.log('-------------------------------');
    }

    if (data.error) throw new Error(data.error);

    console.log('Bridge returned tabs:', data.tabs_found);

    // ── Normalize Players ──
    if (data.players) {
      data.players = data.players.map(p => ({
        name: p['Player Name'] || p.name || p.Name || p.Player || '',
        group: p.Group || p.group || 'A'
      })).filter(p => p.name);
    }

    // ── Normalize Matches ──
    if (data.matches) {
      const lbData = data.group_ranking__leaderboard_
        || data['group_ranking__leaderboard_']
        || data.group_ranking_leaderboard_
        || [];
      const playedMap = {};
      lbData.forEach(row => {
        const name = row.Player || row.name || '';
        const w = parseInt(row.W || row.Wins || 0);
        const l = parseInt(row.L || row.Loss || 0);
        if (name) playedMap[name] = w + l;
      });

      data.matches = data.matches.map(m => {
        const day = m.Date || m.day || m.Day || 'TBD';
        const rawTime = m.Time || m.time || '00:00';
        const time = parseTime(rawTime);
        const p1 = m['Player 1'] || m.p1 || '';
        const p2 = m['Player 2'] || m.p2 || '';
        const rawS1 = m['Score 1'] !== undefined ? m['Score 1'] : m.s1;
        const rawS2 = m['Score 2'] !== undefined ? m['Score 2'] : m.s2;

        let s1 = (rawS1 === '' || rawS1 === null || rawS1 === undefined) ? null : parseInt(rawS1);
        let s2 = (rawS2 === '' || rawS2 === null || rawS2 === undefined) ? null : parseInt(rawS2);

        // Checkbox in column G is the ONLY source of truth for played status.
        // The column header may be "Played?" (with ?) or "Played" — check both.
        // Never use scores as a fallback — unplayed matches have 0,0 scores.
        const playedRaw = m['Played?'] ?? m['Played'] ?? m['played?'] ?? m['played'] ?? m['Status'] ?? '';
        const played = playedRaw === true || String(playedRaw).toUpperCase() === 'TRUE';

        // If not played, null out scores — never show 0-0 for unplayed matches
        const fs1 = played ? s1 : null;
        const fs2 = played ? s2 : null;

        return { day, time, p1, p2, s1: fs1, s2: fs2, played };
      }).filter(m => m.p1 && m.p2);
    }

    // ── Normalize Qualified 16 ──
    if (data.qualified_16) {
      const q = {};
      data.qualified_16.forEach(row => {
        const pos = row.Group || '';
        const name = row.Player || '';
        if (pos && name) q[pos] = name;
      });
      data.qualified16_data = q;
    }

    // ── Normalize Stats (top scorers from sheet) ──
    if (data.stats) {
      data.stats_data = data.stats.map(row => ({
        name: row.Player || row.name || '',
        goals: parseInt(row.Goals || row.goals || 0)
      })).filter(p => p.name && p.goals > 0);
    }

    // ── Normalize Schedule ──
    if (data.schedule) {
      data.schedule = data.schedule.map(s => ({
        day:   s.day || s.Day || 'TBD',
        time:  parseTime(s.Time || s.time || '00:00'),
        label: s.Match || s.Label || s.label || ''
      })).filter(s => s.label);
    }

    return data;
  } catch (e) {
    console.error('Relay Fetch Error:', e.message);
    return { error: e.message };
  }
}

async function requestSync() {
  const btn = document.querySelector('.sync-btn');
  const dot = document.querySelector('.status-dot');
  const timeLabel = document.getElementById('last-sync-time');

  btn.classList.add('loading');
  dot.classList.remove('active');
  dot.classList.add('loading');
  timeLabel.textContent = 'Syncing...';

  let data = null;
  if (CONFIG.appsScriptUrl) {
    data = await fetchRelayData();
  } else if (CONFIG.spreadsheetId) {
    const sheetPlayers   = await fetchSheetData('Players');
    const sheetMatches   = await fetchSheetData('Matches');
    const sheetStandings = await fetchSheetData('Standings');
    if (sheetPlayers && sheetMatches) data = { players: sheetPlayers, matches: sheetMatches, standings: sheetStandings };
  }

  // ── STANDINGS FALLBACK ────────────────────────────────────────────────────
  // The bridge often doesn't expose a 'standings' key — if so, fetch the
  // Standings tab directly via gviz so the override in processData() can fire.
  if (data && !data.error && (!data.standings || data.standings.length === 0) && CONFIG.spreadsheetId) {
    console.log('requestSync: Bridge returned no standings — fetching Standings tab directly via gviz...');
    const directStandings = await fetchSheetData('Standings');
    if (directStandings && directStandings.length > 0) {
      data.standings = directStandings;
      console.log('requestSync: Direct standings fetch OK —', directStandings.length, 'rows');
    } else {
      console.warn('requestSync: Direct standings fetch also returned nothing. Check tab is named exactly "Standings".');
    }
  }

  if (data && !data.error && (data.players || data.leaderboard_data)) {
    console.log('Sync OK. Keys:', Object.keys(data));

    // Assign ALL state BEFORE calling processData()
    STATE.players   = data.players || [];
    STATE.matches   = data.matches || [];
    STATE.schedule  = data.schedule || [];
    STATE.standings = data.standings || [];  // ← must be set BEFORE processData()

    // ── FIX 3: Handle both key variants the bridge may return ─────────────
    // The bridge sometimes returns the leaderboard as 'group_ranking__leaderboard_'
    // (double underscore) and sometimes as 'leaderboard_data'. Handle both.
    STATE._bridgeLeaderboard = data.leaderboard_data
      || data['group_ranking__leaderboard_']
      || data.group_ranking__leaderboard_
      || data['group_ranking_leaderboard_']
      || [];

    STATE._bridgeQualified = data.qualified16_data || {};
    if (data.qualified16_data) STATE.qualified16 = data.qualified16_data;

    // Use sheet's stats as top scorers if available
    if (data.stats_data && data.stats_data.length > 0) {
      STATE._bridgeStats = data.stats_data;
    }

    STATE.lastSync = new Date();

    // processData() now runs with standings already populated — override will fire correctly
    processData();

    // Enrich stats with group info from leaderboard
    if (STATE._bridgeStats && STATE._bridgeStats.length > 0) {
      STATE.goals = STATE._bridgeStats.map(s => ({
        name: s.name,
        goals: s.goals,
        group: (STATE.players.find(p => p.name === s.name) || {}).group || '?'
      }));
    }

    updateUI();
    
    dot.classList.remove('loading');
    dot.classList.add('active');
    timeLabel.textContent = `Live: ${STATE.lastSync.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
  } else {
    timeLabel.textContent = 'Bridge Error';
    dot.classList.remove('loading');
    
    const errorMsg = data && data.error ? data.error : "Check console for details";
    console.error("Bridge Error:", errorMsg);
    if (CONFIG.fallbackToStatic && STATE.players.length === 0) loadStatic();
  }

  btn.classList.remove('loading');
}

function loadStatic() {
  STATE.players = JSON.parse(JSON.stringify(STATIC_PLAYERS));
  STATE.matches = JSON.parse(JSON.stringify(STATIC_MATCHES));
  processData();
  updateUI();
  document.getElementById('last-sync-time').textContent = 'Static Data';
}

  renderStandings();

// ── TIME PARSER ──────────────────────────────────────────────────────────
function parseTime(val) {
  if (!val) return '00:00';
  const s = String(val).trim();
  if (/^\d{1,2}:\d{2}$/.test(s)) return s;
  if (s.includes('T') && (s.includes('-') || s.includes(':'))) {
    try {
      const d = new Date(s);
      if (!isNaN(d.getTime())) {
        const h = d.getUTCHours().toString().padStart(2, '0');
        const m = d.getUTCMinutes().toString().padStart(2, '0');
        return h + ':' + m;
      }
    } catch (e) { /* fall through */ }
  }
  if (!isNaN(s) && parseFloat(s) > 0 && parseFloat(s) < 1) {
    const totalMinutes = Math.round(parseFloat(s) * 24 * 60);
    const h = Math.floor(totalMinutes / 60).toString().padStart(2, '0');
    const m = (totalMinutes % 60).toString().padStart(2, '0');
    return h + ':' + m;
  }
  return s;
}

// ── COLOR PALETTE ────────────────────────────────────────────────────────
const groupColors = {
  A:'#00e676',B:'#69f0ae',C:'#40c4ff',D:'#ff6e40',
  E:'#ea80fc',F:'#ffd740',G:'#ff80ab',H:'#80d8ff'
};

function initials(name) {
  if (!name || typeof name !== 'string') return '?';
  return name.split(' ').filter(w => w).map(w=>w[0].toUpperCase()).slice(0,2).join('');
}
function avatarStyle(group) {
  const c = groupColors[group] || '#00e676';
  return `background: linear-gradient(135deg, ${c}33, ${c}11); color: ${c}; border: 1px solid ${c}44;`;
}

// ── RENDER MATCHES ────────────────────────────────────────────────────────
let currentFilter = 'all';
function filterMatches(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMatches();
}

function renderMatches() {
  const container = document.getElementById('matches-list');
  const allMatches = getMatches();
  let filtered = allMatches;
  if (currentFilter === 'played') filtered = allMatches.filter(m => m.played);
  else if (currentFilter === 'pending') filtered = allMatches.filter(m => !m.played);
  else if (currentFilter === 'Today') filtered = allMatches.filter(m => m.day === 'Today');
  else if (currentFilter === 'Tomorrow') filtered = allMatches.filter(m => m.day === 'Tomorrow');

  // Group by day
  const byDay = {};
  filtered.forEach(m => {
    if (!byDay[m.day]) byDay[m.day] = [];
    byDay[m.day].push(m);
  });

  container.innerHTML = '';
  if (allMatches.length === 0) {
    container.innerHTML = `<div style="padding: 40px; text-align: center; color: var(--muted);">No matches found. Check your "Matches" tab and headers (Day, Time, Player 1, Score 1...).</div>`;
    return;
  }

  Object.entries(byDay).forEach(([day, matches]) => {
    const dayHeader = document.createElement('div');
    dayHeader.className = 'match-day-header';
    dayHeader.textContent = `📅 ${day}`;
    container.appendChild(dayHeader);

    matches.forEach(m => {
      const played = m.played;
      const isDraw = played && m.s1 !== null && m.s1 === m.s2;
      const winner = played ? (m.s1 > m.s2 ? m.p1 : m.s1 < m.s2 ? m.p2 : null) : null;
      const p1g = getPlayers().find(p => p.name === m.p1)?.group || 'A';
      const p2g = getPlayers().find(p => p.name === m.p2)?.group || 'A';

      const card = document.createElement('div');
      card.className = `match-card ${played ? (isDraw ? 'draw' : 'played') : 'pending'}`;
      card.innerHTML = `
        <div class="player-side">
          <div class="player-avatar" style="${avatarStyle(p1g)}">${initials(m.p1 || 'TBD')}</div>
          <div>
            <div class="player-name">${m.p1 || 'TBD'}</div>
            ${winner === m.p1 && m.p1 ? '<div class="winner-badge">⭐ Winner</div>' : ''}
            ${isDraw ? '<div class="draw-badge">🤝 Draw</div>' : ''}
          </div>
        </div>
        <div class="match-score">
          ${played
            ? `<div class="score-display" ${isDraw ? 'style="color: var(--blue, #40c4ff);"' : ''}>${m.s1} – ${m.s2}</div>`
            : `<div class="score-pending">VS</div>`}
          <div class="match-time">${m.time}</div>
        </div>
        <div class="player-side right">
          <div>
            <div class="player-name">${m.p2 || 'TBD'}</div>
            ${winner === m.p2 && m.p2 ? '<div class="winner-badge">⭐ Winner</div>' : ''}
            ${isDraw ? '<div class="draw-badge">🤝 Draw</div>' : ''}
          </div>
          <div class="player-avatar" style="${avatarStyle(p2g)}">${initials(m.p2 || 'TBD')}</div>
        </div>
      `;
      container.appendChild(card);
    });
  });

  if (container.children.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">No matches found</div>';
  }
}

// ── RENDER KNOCKOUT (VERTICAL) ───────────────────────────────────────
function renderKnockout() {
  const bracket = document.getElementById('bracket');
  bracket.innerHTML = '';

  const q16 = getQualified16();
  const r16 = [
    {label:'M1', p1:q16.A1||'TBD', p2:q16.B2||'TBD'},
    {label:'M2', p1:q16.C1||'TBD', p2:q16.D2||'TBD'},
    {label:'M3', p1:q16.E1||'TBD', p2:q16.F2||'TBD'},
    {label:'M4', p1:q16.G1||'TBD', p2:q16.H2||'TBD'},
    {label:'M5', p1:q16.B1||'TBD', p2:q16.A2||'TBD'},
    {label:'M6', p1:q16.D1||'TBD', p2:q16.C2||'TBD'},
    {label:'M7', p1:q16.F1||'TBD', p2:q16.E2||'TBD'},
    {label:'M8', p1:q16.H1||'TBD', p2:q16.G2||'TBD'}
  ];

  const qf = [
    {label:'QF1', p1:'TBD', p2:'TBD'}, 
    {label:'QF2', p1:'TBD', p2:'TBD'},
    {label:'QF3', p1:'TBD', p2:'TBD'}, 
    {label:'QF4', p1:'TBD', p2:'TBD'}
  ];
  
  const sf = [
    {label:'SF1', p1:'TBD', p2:'TBD'},
    {label:'SF2', p1:'TBD', p2:'TBD'}
  ];
  
  const final = [
    {label:'FINAL', p1:'TBD', p2:'TBD'}
  ];

  const rounds = [
    { title: 'Round of 16', matches: r16, pairs: true },
    { title: 'Quarterfinals', matches: qf, pairs: true },
    { title: 'Semifinals', matches: sf, pairs: true },
    { title: 'Final', matches: final, pairs: false }
  ];

  const createMatchCard = (m) => {
    const isTbd = m.p1 === 'TBD';
    const p1g = getPlayers().find(p => p.name === m.p1)?.group || 'A';
    const p2g = getPlayers().find(p => p.name === m.p2)?.group || 'A';
    
    const activeMatch = getMatches().find(mx => [mx.label, mx.label?.toUpperCase()].includes(m.label));
    const s1 = (activeMatch && activeMatch.s1 !== null) ? activeMatch.s1 : '-';
    const s2 = (activeMatch && activeMatch.s2 !== null) ? activeMatch.s2 : '-';
    
    return `
      <div class="bracket-match">
        <div class="bracket-match-label">${m.label}</div>
        <div class="bracket-player ${isTbd ? '' : ''}">
          <div class="bracket-crest" style="${avatarStyle(p1g)}">${initials(m.p1)}</div>
          <span class="bracket-player-name">${m.p1}</span>
          <span class="bracket-player-score">${isTbd ? '-' : s1}</span>
        </div>
        <div class="bracket-player ${isTbd ? '' : ''}">
          <div class="bracket-crest" style="${avatarStyle(p2g)}">${initials(m.p2)}</div>
          <span class="bracket-player-name">${m.p2}</span>
          <span class="bracket-player-score">${isTbd ? '-' : s2}</span>
        </div>
      </div>
    `;
  };

  rounds.forEach(round => {
    const roundDiv = document.createElement('div');
    roundDiv.className = 'vertical-round';
    
    const title = document.createElement('h3');
    title.className = 'vertical-round-title';
    title.textContent = round.title;
    roundDiv.appendChild(title);
    
    const matchesDiv = document.createElement('div');
    matchesDiv.className = 'vertical-matches';
    
    if (round.pairs) {
      for (let i = 0; i < round.matches.length; i += 2) {
        if (i + 1 < round.matches.length) {
          const m1 = round.matches[i];
          const m2 = round.matches[i+1];
          matchesDiv.innerHTML += `
            <div class="match-pair">
              <div class="match-pair-label">Winner to ${round.title === 'Round of 16' ? 'QF' + (i/2 + 1) : round.title === 'Quarterfinals' ? 'SF' + (i/2 + 1) : 'FINAL'}</div>
              ${createMatchCard(m1)}
              ${createMatchCard(m2)}
            </div>
          `;
        } else {
          matchesDiv.innerHTML += createMatchCard(round.matches[i]);
        }
      }
    } else {
      round.matches.forEach(m => {
        matchesDiv.innerHTML += createMatchCard(m);
      });
    }
    
    roundDiv.appendChild(matchesDiv);
    bracket.appendChild(roundDiv);
  });
}

// ── RENDER STATS ──────────────────────────────────────────────────────────

  const maxGoals = allGoals.length > 0 ? allGoals[0].goals : 1;

  const byWins = [...currentLeaderboard].sort((a,b) => b.w - a.w || b.gf - a.gf).slice(0,12);

      <span class="stat-group">${p.group}</span>

  const gdHTML = byGD.map((p,i) => `

      <span class="stat-group">${p.group}</span>
      <div class="stat-bar-wrap">
        <div class="stat-bar" style="width:${maxGD > 0 ? Math.max((p.gd/maxGD)*100,0) : 0}%;background:${p.gd >= 0 ? 'linear-gradient(90deg,var(--green),var(--green-dim))' : 'linear-gradient(90deg,var(--red),#aa0000)'}"></div>
      </div>
      <div class="stat-value" style="color:${p.gd >= 0 ? 'var(--green)' : 'var(--red)'}">${p.gd > 0 ? '+' : ''}${p.gd}</div>
    </div>
  `).join('');

  const byPts = [...currentLeaderboard].sort((a,b) => b.pts - a.pts || b.gd - a.gd).slice(0,12);
  const maxPts = byPts.length > 0 ? byPts[0].pts : 0;

  const ptsHTML = byPts.map((p,i) => `
    <div class="stat-row">
      <div class="stat-rank">${i+1}</div>
      <div class="player-avatar" style="${avatarStyle(p.group)};width:30px;height:30px;font-size:0.7rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;">${initials(p.name)}</div>
      <div class="stat-name">${p.name}</div>
      <span class="stat-group">${p.group}</span>
      <div class="stat-bar-wrap">
        <div class="stat-bar" style="width:${maxPts > 0 ? (p.pts/maxPts)*100 : 0}%"></div>
      </div>
      <div class="stat-value">${p.pts}</div>
    </div>
  `).join('');

  container.innerHTML = `
    <div class="stat-card">
      <div class="stat-card-header">⚽ Top Goal Scorers</div>
      ${scorersHTML}
    </div>
    <div class="stat-card">
      <div class="stat-card-header">🏅 Points Leaderboard</div>
      ${ptsHTML}
    </div>
    <div class="stat-card">
      <div class="stat-card-header">🏆 Most Wins</div>

      { day: 'Monday — Round of 16', time:'18:20', label:'H1 vs G2' },
      { day: 'Tuesday — Quarterfinals', time:'16:00', label:'QF1' },
      { day: 'Tuesday — Quarterfinals', time:'16:20', label:'QF2' },
      { day: 'Tuesday — Quarterfinals', time:'16:40', label:'QF3' },
      { day: 'Tuesday — Quarterfinals', time:'17:00', label:'QF4' },
      { day: 'Wednesday — Semifinals', time:'16:00', label:'SF1' },
      { day: 'Wednesday — Semifinals', time:'16:20', label:'SF2' },
      { day: 'Thursday — Final', time:'18:00', label:'Grand Final' }
    ];
  }

  const byDay = {};
  scheduleData.forEach(s => {
    if (!byDay[s.day]) byDay[s.day] = [];
    byDay[s.day].push(s);
  });

  container.innerHTML = '';
  Object.entries(byDay).forEach(([day, items]) => {
    const card = document.createElement('div');
    card.className = 'sched-card';
    card.innerHTML = `
      <div class="sched-day">${day}</div>
      ${items.map(item => `
        <div class="sched-match">
          <span class="sched-time">${item.time}</span>
          <span class="sched-label">${item.label}</span>
        </div>
      `).join('')}
    `;
    container.appendChild(card);
  });
}

// ── VIEW SWITCHER ─────────────────────────────────────────────────────────
function showView(id, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  if (btn) btn.classList.add('active');
}

// Initial schedule render
renderSchedule();
</script>
